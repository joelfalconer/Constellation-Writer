decision:
  selected_shell: Electron
  selected_version_for_scaffold: 43.2.0
  adr: ADR-0004
  status: accepted_for_F2_scaffold
  reason_summary: >-
    Both controls can satisfy the bounded security and native-integration contract. Electron is
    selected because the same bundled Chromium engine is used across Windows and macOS and the
    measured hosted-runner shell-ready time was materially lower on both platforms. This better
    protects the writer-surface consistency and time-to-first-word priorities at the current gate.
    Tauri's much smaller distribution footprint is acknowledged but is not decisive, and the
    package/RSS measurements are not sufficiently comparable to treat them as winner metrics.
  revisit_triggers:
    - physical_IME_or_accessibility_veto
    - F2_memory_or_startup_regression_against_real_hardware_budget
    - Electron_security_boundary_requires_broad_renderer_privilege
    - native_integration_or_distribution_burden_becomes_material
    - editor_spike_4_discovers_shell_specific_engine_requirement
