name: Validate foundation contracts

on:
  pull_request:
  push:
    branches: [main, foundation/project-establishment]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/validator/requirements.txt
      - run: python tools/validator/validate.py --repo .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-validation-report
          path: build/validation-report.json
