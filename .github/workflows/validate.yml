name: Validate foundation contracts

# Hosted GitHub Actions is an optional replication surface. The canonical
# non-gating path is `python tools/local_validate.py --suite foundation`.
on:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/validator/requirements.txt
      - run: python tools/validator/validate.py --repo .
      - run: pytest -q tests/contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-validation-report
          path: build/validation-report.json
