closure_posture: >-
  F1 machine/adversarial closure is promoted on main through PR #15. The compile decision is canonical,
  the Mutation Envelope is the sole canonical application authority, Compendium canon state is owned only by
  claim_record.canon_state, volatile user state is noncanonical, typed UUIDv7 is the accepted identity model,
  and annotation storage authority remains explicitly deferred. The higher-order atomicity law now matches the
  filesystem guarantees actually claimed: atomic single-file replacement where supported and recovery-backed
  multi-file consistency otherwise. Hosted GitHub Actions is non-gating and manual-only. No fresh local closure
  execution is claimed because the current runtime lacks a repository checkout. The project is now waiting only
  for the explicit human F1 gate decision. If approved, the first F2 action is a passing local
  tools/local_validate.py --suite all receipt before executable-substrate reliance.
