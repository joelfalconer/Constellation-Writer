version: 0.4.0
status: candidate_F1_machine_closure
updated_at: 2026-08-22

contradictions_and_tensions:
  - id: CON-001
    topic: identifier_format
    positions: [stable_UUIDs, ULIDs_for_readability, UUIDv7_candidate]
    current_direction: UUIDv7_with_typed_prefix
    status: accepted_F1_architecture_coherence
    severity: high
    decision_record: ADR-0010
    acceptance_basis:
      - stable identity remains independent of title path and placement
      - typed UUIDv7 provides standard opaque identity with useful diagnostics and no manuscript-order semantics
      - serious rivals remain documented in ADR-0010
    revisit_trigger: before_public_durable_data_if_cross_language_or_prefix_implementation_fails

  - id: CON-002
    topic: user_state_canonicality
    positions: [cursor_in_sheet_sidecar, cursor_as_local_ephemeral_state]
    current_direction: local_ephemeral_state
    status: accepted_F1_architecture_coherence
    severity: high
    decision_record: ADR-0009
    acceptance_basis:
      - cursor_scroll_and_panes_do_not_describe_project_truth
      - volatile user state would create canonical churn and sync conflicts
      - portable handoff may be added later only as optional non_authoritative state
    revisit_trigger: if_multi_device_or_handoff_requires_portable_context_state

  - id: CON-003
    topic: mutation_ownership
    positions: [PatchSession_owns_transaction, Recovery_owns_transaction, shared_Mutation_Envelope]
    current_direction: shared_Mutation_Envelope
    status: accepted_F1_architecture_coherence
    severity: critical
    decision_record: ADR-0007
    acceptance_condition: >-
      Mutation Envelope is the sole transaction/application authority, PatchSession owns
      proposal/review/provenance, Recovery owns preservation and restore mechanisms, and
      restore itself re-enters the Mutation Envelope rather than creating a second write path.
    acceptance_basis:
      - MUTATION_ENVELOPE already spans autosave human commands PatchSession imports migrations conflicts and restore
      - PatchSession v0.2 explicitly delegates transaction mechanics
      - Recovery v0.2 uses the Mutation Envelope for high consequence operations
      - dependency rules forbid PatchSession and Recovery as competing transaction owners
      - state authority matrix now names one owner for canonical application
    validation_state: architecture_coherence_accepted_execution_pending_F2
    revisit_trigger: >-
      Reopen if F2 shows blocking autosave overhead, inconsistent stale-base behavior,
      recovery that cannot be represented through the envelope, or a necessary second canonical write path.

  - id: CON-004
    topic: annotations_storage
    positions: [inline_comments, Sheet_sidecar_comments, dedicated_annotation_log]
    current_direction: dedicated_annotation_log_with_optional_portable_inline_form
    status: deferred_to_F2_validation_with_direction_preserved
    severity: medium
    decision_record: ADR-0008
    defer_reason: >-
      No F1 authority conflict remains, but file-count, sync, re-anchoring, split/merge and
      compaction behavior require executable substrate evidence before acceptance.
    revisit_trigger: annotation_reanchor_split_merge_and_sync_tests

  - id: CON-005
    topic: manuscript_ordering
    positions: [array_order, fractional_order_keys]
    current_direction: array_order_for_solo_v1_with_revisit_trigger
    status: accepted_for_solo_v1_candidate_contract
    severity: medium
    revisit_trigger: before_app_managed_sync_or_concurrent_manifest_editing

  - id: CON-006
    topic: Compendium_implementation_priority
    positions: [full_early_sidecar, schema_only_boundary_until_foundation]
    current_direction: minimal_boundary_and_deferred_broad_implementation
    status: accepted_F0_product_sequencing_baseline
    severity: high
    decision_record: ADR-0011
    revisit_trigger: after_Writer_Chair_and_Manuscript_Machine_gates_or_user_evidence_of_unserved_continuity_need

research_uncertainties:
  - id: UNC-EVID-001
    topic: historical_deep_research_locator_recovery
    observation: >-
      The final SRC-DR-001 report is referenced as a conversation attachment but was not
      retrievable from the repository or targeted File Library searches on 2026-08-17.
      Search results surfaced precursor research briefs, not the final findings report.
    consequence: EU-001_through_EU-010_exact_spans_remain_unresolved_with_explicit_reason
    severity: medium
    revisit_trigger: final_report_attachment_or_archive_copy_becomes_available

  - id: UNC-EVID-002
    topic: vendor_documentation_vs_professional_usability
    observation: >-
      Official current documentation now covers all eight requested benchmark products at the
      documented-capability level, but does not establish comparative usability, fatigue,
      accessibility quality, switching motives, or professional trust.
    consequence: do_not_upgrade_current_product_mechanics_to_user_outcome_claims
    severity: high
    revisit_trigger: professional_writer_assays_or_switcher_critical_incident_research

  - id: UNC-EVID-003
    topic: integrated_publishing_vs_local_first_authority
    observation: >-
      Vellum and Atticus demonstrate short manuscript-to-publication paths, while Atticus also
      documents cloud autosave/account recovery and Vellum imports into a native book format.
      The convenience/sovereignty tradeoff is a design tension rather than a benchmark verdict.
    consequence: keep_compile_and_storage_architecture_decisions_testable_in_issues_5_and_6
    severity: medium
    revisit_trigger: compile_spike_and_durable_substrate_tests

open_critical: []

deferred_noncritical:
  - CON-004

closure_rule: >-
  A current_direction is not a resolved contradiction by itself. Critical contradictions remain
  open until the named gate accepts, revises, or explicitly defers the direction with evidence
  and a falsifier. Noncritical tensions may be deferred only when they do not create competing
  canonical authority and have an explicit executable revisit trigger.
