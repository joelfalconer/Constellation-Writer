version: 0.1.0
status: candidate

invariants:
  INV-AUTH-001:
    statement: The editor is the sovereign authorship surface.
    validation: editor_remains_largest_and_core_workflow_needs_no_dashboard
  INV-DATA-001:
    statement: Manuscript prose is canonically stored in readable text files.
    validation: prose_remains_readable_after_application_removal
  INV-ID-001:
    statement: Object identity is independent of title, path, and placement.
    validation: rename_move_and_reorder_preserve_object_identity
  INV-ASM-001:
    statement: Manuscript order is defined only by a manuscript manifest.
    validation: filesystem_sort_never_changes_compile_order
  INV-MUT-001:
    statement: Non-human mutation of canonical state requires governed review.
    validation: ai_script_and_import_cannot_write_around_mutation_engine
  INV-REC-001:
    statement: Derived stores can be removed without losing canonical state.
    validation: delete_workbench_state_then_rebuild
  INV-CMP-001:
    statement: Equivalent canonical inputs and profile semantics produce equivalent output.
    validation: compile_golden_and_determinism_tests
  INV-CONFLICT-001:
    statement: Competing file versions are preserved until explicitly resolved.
    validation: sync_conflict_retains_both_versions
  INV-RETURN-001:
    statement: Summoned tools return the writer to the previous sentence and context.
    validation: cursor_selection_scroll_and_return_path_are_preserved
  INV-AI-001:
    statement: AI output is candidate material until explicitly accepted.
    validation: ai_generated_text_and_claims_enter_review_queue
  INV-PRIV-001:
    statement: Sensitive context is never disclosed to external services without explicit scope.
    validation: remote_ai_context_preflight_and_exclusions
