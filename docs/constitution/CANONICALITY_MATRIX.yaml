version: 0.1.0
status: candidate

classes:
  canonical: durable_project_truth
  logged: durable_event_or_history_truth
  derived: rebuildable_projection
  ephemeral: session_or_preview_state

entries:
  - {state: sheet_identity, owner: sheet_frontmatter, class: canonical, mirrors: [sqlite_catalog]}
  - {state: sheet_prose, owner: sheet_markdown_body, class: canonical, mirrors: [editor_buffer, full_text_index]}
  - {state: sheet_local_metadata, owner: sheet_sidecar, class: canonical, mirrors: [sqlite_catalog]}
  - {state: annotations, owner: annotation_log, class: canonical, mirrors: [sqlite_catalog]}
  - {state: manuscript_identity, owner: manuscript_manifest, class: canonical, mirrors: [sqlite_catalog]}
  - {state: manuscript_order, owner: manuscript_manifest, class: canonical, mirrors: [binder_projection, sqlite_catalog]}
  - {state: manuscript_placement, owner: manuscript_manifest_node, class: canonical, mirrors: [sqlite_catalog]}
  - {state: compile_profile, owner: compile_profile_file, class: canonical, mirrors: [compile_cache]}
  - {state: entity, owner: entity_record, class: canonical, mirrors: [sqlite_catalog, graph_projection]}
  - {state: claim, owner: claim_record, class: canonical, mirrors: [sqlite_catalog, graph_projection]}
  - {state: evidence, owner: evidence_record, class: canonical, mirrors: [sqlite_catalog]}
  - {state: transformation_history, owner: mutation_and_patch_logs, class: logged, mirrors: [sqlite_catalog]}
  - {state: migration_history, owner: migration_logs, class: logged, mirrors: [sqlite_catalog]}
  - {state: snapshot_state, owner: snapshot_manifest, class: logged, mirrors: [backup_status_index]}
  - {state: conflict_resolution, owner: conflict_and_mutation_logs, class: logged, mirrors: [sqlite_catalog]}
  - {state: cursor_and_scroll, owner: local_user_state, class: ephemeral, mirrors: []}
  - {state: recent_context, owner: local_user_state, class: ephemeral, mirrors: []}
  - {state: search_results, owner: search_index, class: derived, mirrors: []}
  - {state: graph_view, owner: graph_projection, class: derived, mirrors: []}
  - {state: semantic_index, owner: embedding_cache, class: derived, mirrors: []}
  - {state: compile_preview, owner: preview_cache, class: derived, mirrors: []}

invariant: deleting_all_derived_and_ephemeral_state_must_not_destroy_project_truth
