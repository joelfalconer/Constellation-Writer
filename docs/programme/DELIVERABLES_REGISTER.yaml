completion_rule:
  foundation_buildout_complete_when:
    - all_non_executable_foundation_deliverables_materialized
    - current_contract_kernel_has_machine_validation_receipt
    - execution_only_deliverables_have_issues_test_definitions_and_receipt_destinations
    - no_unexecuted_experiment_is_marked_tested
  promotion_still_requires:
    - human_gate_decision
    - technology_spikes
    - executable_vertical_slice
